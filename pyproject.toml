[project]
name = "rag-grounding-check"
version = "0.1.0"
description = "Offline check that a RAG answer's citations, quotes and numbers match the retrieved sources"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rag-grounding-check = "grounding_check.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
